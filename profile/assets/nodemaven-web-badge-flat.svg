<svg xmlns="http://www.w3.org/2000/svg"
      width="228"
      height="28"
      viewBox="0 0 228 28"
     role="img"
     aria-label="Website nodemaven.com">

  <defs>
    <linearGradient id="website-gradient"
                    x1="0%"
                    y1="0%"
                    x2="100%"
                    y2="0%">
      <stop offset="0%" stop-color="#2CCCB7"/>
      <stop offset="55%" stop-color="#2EA8D8"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- Left label section -->
  <rect x="0"
        y="0"
        width="88"
        height="28"
        fill="#555555"/>

  <!-- Right link section -->
  <rect x="88"
        y="0"
        width="140"
        height="28"
        fill="url(#website-gradient)"/>

  <!-- Divider -->
  <rect x="87"
        y="0"
        width="1"
        height="28"
        fill="#666666"/>

  <!-- Browser icon -->
  <g transform="translate(9,7)"
     fill="none"
     stroke="#FFFFFF"
     stroke-width="1.4">
    <circle cx="7"
            cy="7"
            r="5.8"/>

    <path d="M1.5 5.3h11"/>

    <path d="M7 1.2
             c1.6 1.6 2.4 3.6 2.4 5.8
             S8.6 11.2 7 12.8"/>

    <path d="M7 1.2
             c-1.6 1.6-2.4 3.6-2.4 5.8
             S5.4 11.2 7 12.8"/>
  </g>

  <!-- Label -->
  <text x="27"
        y="18"
        font-family="Arial, Helvetica, sans-serif"
        font-size="9.5"
        font-weight="700"
        letter-spacing="0.65"
        fill="#FFFFFF">WEBSITE</text>

  <!-- Destination -->
  <text x="100"
        y="18"
        font-family="Arial, Helvetica, sans-serif"
        font-size="9.5"
        font-weight="700"
        letter-spacing="0.55"
        fill="#FFFFFF">NODEMAVEN.COM</text>

</svg>