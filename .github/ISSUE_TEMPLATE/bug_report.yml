name: Bug report
description: Something in this repository does not work as documented
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: if the proxy connects but a target refuses you, that is usually not
        a bug in this code. Use the "Blocked by a target" template instead - it asks for
        the details we need to tell the two apart.

        **Never paste a `Proxy-Authorization` header, a connection string with a password,
        or an API key.** Base64 is not encryption. Redact before posting.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: The smallest code that shows the problem. Redact credentials.
      render: python
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: "1.2.0"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: OS and language version
      placeholder: "Windows 11, Python 3.12"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error output
      description: Full traceback if there is one. Credentials redacted.
      render: shell
